<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>hetops — Batch Runbook</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Form */
    .batch-form { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:1.5rem; margin-bottom:2rem; }
    .batch-form h2 { margin:0 0 1rem; font-size:1.1rem; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1rem; }
    .form-row.full { grid-template-columns:1fr; }
    .form-group label { display:block; font-size:0.82rem; font-weight:600; color:var(--text-muted); margin-bottom:0.3rem; text-transform:uppercase; letter-spacing:0.04em; }
    .form-group select, .form-group input { width:100%; padding:0.5rem 0.6rem; border:1px solid var(--border); border-radius:4px; font-size:0.9rem; font-family:inherit; background:var(--bg); }
    .form-group select:focus, .form-group input:focus { outline:none; border-color:var(--accent); }
    .funding-checks { display:flex; gap:1.25rem; flex-wrap:wrap; padding:0.25rem 0; }
    .funding-checks label { font-size:0.9rem; font-weight:normal; text-transform:none; letter-spacing:0; display:flex; align-items:center; gap:0.35rem; cursor:pointer; }
    .funding-checks input[type=checkbox] { margin:0; }
    .batch-name-preview { font-size:0.85rem; color:var(--text-muted); margin-top:0.25rem; }
    .course-info { font-size:0.82rem; color:var(--text-muted); margin-top:0.5rem; padding:0.5rem 0.75rem; background:var(--accent-light); border-radius:4px; }
    .course-info span { display:inline-block; margin-right:1.25rem; }

    /* Runbook */
    #runbook { margin-top:1rem; }
    .rb-empty { text-align:center; color:var(--text-muted); padding:3rem 1rem; font-size:0.95rem; }
    .rb-phase { margin-bottom:2rem; }
    .rb-phase-hdr { display:flex; align-items:baseline; gap:0.75rem; border-bottom:2px solid var(--border); padding-bottom:0.4rem; margin-bottom:0.75rem; }
    .rb-phase-hdr h2 { margin:0; font-size:1.1rem; }
    .rb-phase-hdr .rb-dates { font-size:0.82rem; color:var(--text-muted); }
    .rb-phase-hdr .rb-owner { font-size:0.78rem; color:var(--stage-ops); font-weight:600; margin-left:auto; }
    .rb-q { font-style:italic; color:var(--text-muted); font-size:0.88rem; margin-bottom:0.75rem; border-left:2px solid var(--accent); padding-left:0.75rem; }
    .rb-section h3 { font-size:0.92rem; color:var(--text-muted); margin:0.75rem 0 0.35rem; }
    .rb-items { list-style:none; padding:0; margin:0 0 0.5rem; }
    .rb-items li { padding:0.25rem 0 0.25rem 1.6rem; position:relative; font-size:0.88rem; line-height:1.5; }
    .rb-items li::before { content:"☐"; position:absolute; left:0; color:var(--text-muted); font-size:0.95rem; }
    .rb-items li.adapter { background:var(--accent-light); margin:0.15rem 0; padding-left:1.6rem; padding-right:0.5rem; border-radius:3px; }
    .rb-adapter-tag { font-size:0.72rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; padding:0.1rem 0.35rem; border-radius:2px; color:white; margin-right:0.35rem; }
    .rb-adapter-tag.govt { background:var(--chip-govt); }
    .rb-adapter-tag.csr { background:var(--chip-csr); }
    .rb-adapter-tag.paid { background:var(--chip-paid); }
    .rb-week-title { font-weight:600; color:var(--text); }
    .rb-artifact { font-size:0.82rem; color:var(--text-muted); padding:0.15rem 0 0.15rem 1.6rem; }
    .rb-artifact::before { content:"↳ "; }
    .rb-divider { border:none; border-top:1px dashed var(--border); margin:1.5rem 0; }
  </style>
</head>
<body>

<h1>hetops — Batch Runbook</h1>
<p class="subtitle">Configure the batch. The runbook builds itself.</p>

<!-- ===== FORM ===== -->
<div class="batch-form">
  <h2>Batch Configuration</h2>

  <div class="form-row">
    <div class="form-group">
      <label>Course</label>
      <select id="f-course"><option value="">Loading courses…</option></select>
      <div id="course-info" class="course-info" style="display:none;"></div>
    </div>
    <div class="form-group">
      <label>Batch Start Date</label>
      <input type="date" id="f-start">
    </div>
  </div>

  <div class="form-row">
    <div class="form-group">
      <label>Batch Name (auto-generated)</label>
      <input type="text" id="f-name" readonly>
      <div class="batch-name-preview">
        <label style="font-size:0.8rem; font-weight:normal; text-transform:none; letter-spacing:0;">Tags (optional): <input type="text" id="f-tags" placeholder="e.g. pilot, anand-district" style="width:180px; padding:0.2rem 0.4rem; font-size:0.82rem;"></label>
      </div>
    </div>
    <div class="form-group">
      <label>Funding Model</label>
      <div class="funding-checks">
        <label><input type="checkbox" id="f-govt" value="govt"> Government</label>
        <label><input type="checkbox" id="f-csr" value="csr"> CSR</label>
        <label><input type="checkbox" id="f-paid" value="paid"> Paid</label>
      </div>
    </div>
  </div>
</div>

<!-- ===== RUNBOOK (generated) ===== -->
<div id="runbook">
  <div class="rb-empty">Select a course and start date to generate the runbook.</div>
</div>

<footer>hetops · Batch Runbook <span id="dedup-status" style="font-size:0.75rem; color:var(--text-muted);"></span></footer>

<script>
// ===== STATE =====
let courses = [];
const stages = [];   // loaded from data/checklists/bl*.json
const adapters = {}; // loaded from data/checklists/adapter-*.json

const STAGE_FILES = [
  'bl1-pre-batch.json', 'bl2-mobilize.json', 'bl3-kick-off.json',
  'bl4-delivery.json', 'bl5-assessment.json', 'bl6-closure.json', 'bl7-livelihood.json'
];
const ADAPTER_FILES = ['adapter-govt.json', 'adapter-csr.json', 'adapter-paid.json'];

// ===== LOAD DATA =====
async function loadAll() {
  // Load courses
  try {
    const catRes = await fetch('data/courses/catalog.json');
    const catalog = await catRes.json();
    const sel = document.getElementById('f-course');
    sel.innerHTML = '<option value="">— Select a course —</option>';
    for (const file of catalog) {
      const res = await fetch('data/courses/' + file);
      const c = await res.json();
      courses.push(c);
      const opt = document.createElement('option');
      opt.value = c.id;
      opt.textContent = c.name + ' (' + c.durationWeeks + ' weeks)';
      sel.appendChild(opt);
    }
  } catch(e) {
    console.error('Failed to load courses:', e);
    document.getElementById('f-course').innerHTML = '<option value="">Error loading courses</option>';
  }

  // Load stage checklists
  for (const file of STAGE_FILES) {
    try {
      const res = await fetch('data/checklists/' + file);
      stages.push(await res.json());
    } catch(e) { console.error('Failed to load ' + file, e); }
  }

  // Load adapters
  for (const file of ADAPTER_FILES) {
    try {
      const res = await fetch('data/checklists/' + file);
      const a = await res.json();
      adapters[a.id] = a;
    } catch(e) { console.error('Failed to load ' + file, e); }
  }
}

// ===== HELPERS =====
function fmt(d) {
  return d.toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });
}
function addDays(d, n) { const r = new Date(d); r.setDate(r.getDate() + n); return r; }
function addWeeks(d, n) { return addDays(d, n * 7); }
function weekRange(start, weekNum) {
  const s = addWeeks(start, weekNum);
  return fmt(s) + ' – ' + fmt(addDays(s, 6));
}

function genBatchName(course, startDate, tags) {
  if (!course || !startDate) return '';
  const d = new Date(startDate);
  const mon = d.toLocaleString('en', { month:'short' }).toUpperCase();
  const yr = d.getFullYear().toString().slice(-2);
  let name = course.shortName + '-' + mon + yr;
  if (tags && tags.trim()) name += '-' + tags.trim().replace(/\s+/g, '-').toLowerCase();
  return name;
}

function getSelectedFunding() {
  const f = [];
  if (document.getElementById('f-govt').checked) f.push('govt');
  if (document.getElementById('f-csr').checked) f.push('csr');
  if (document.getElementById('f-paid').checked) f.push('paid');
  return f;
}

// Resolve dotted path like "evidenceArtifacts.baseline" from course object
function resolvePath(obj, path) {
  return path.split('.').reduce((o, k) => (o && o[k] !== undefined) ? o[k] : [], obj);
}

// ===== DEDUP =====
// Layer 1: Jaccard (always works, synchronous)
const STOP = new Set(['a','an','the','is','are','was','were','be','been','and','or','of','on','in','to','for','with','by','at','from','if','all','any','per','has','have','had']);
const JAC_THRESHOLD = 0.65;
const COS_THRESHOLD = 0.82;

function tokenize(s) {
  return new Set(s.toLowerCase().replace(/[^a-z0-9 ]/g, '').split(/\s+/).filter(w => w.length > 1 && !STOP.has(w)));
}

function jaccard(a, b) {
  if (a.size === 0 && b.size === 0) return 1;
  let inter = 0;
  for (const t of a) if (b.has(t)) inter++;
  return inter / (a.size + b.size - inter);
}

// Layer 2: Cosine via embeddings (async, best-effort)
const embeddingCache = {};  // text -> Float32Array

function cosine(a, b) {
  let dot = 0, na = 0, nb = 0;
  for (let i = 0; i < a.length; i++) { dot += a[i]*b[i]; na += a[i]*a[i]; nb += b[i]*b[i]; }
  return dot / (Math.sqrt(na) * Math.sqrt(nb));
}

// Find index of similar item in seen list, or -1
// seen = [{text, tokens, emb, tags[]}]
function findSimilar(text, seen) {
  const tokens = tokenize(text);
  const emb = embeddingCache[text.toLowerCase().trim()] || null;
  for (let i = 0; i < seen.length; i++) {
    if (jaccard(tokens, seen[i].tokens) >= JAC_THRESHOLD) return i;
    if (emb && seen[i].emb && cosine(emb, seen[i].emb) >= COS_THRESHOLD) return i;
  }
  return -1;
}

// Collect all items for a stage into seen[] with tag merging, then render
// Each entry in seen: {text, tokens, emb, tags[], section}
function collectItems(text, tags, section, seen) {
  const idx = findSimilar(text, seen);
  if (idx >= 0) {
    for (const t of tags) {
      if (!seen[idx].tags.includes(t)) seen[idx].tags.push(t);
    }
    return;
  }
  seen.push({
    text,
    tokens: tokenize(text),
    emb: embeddingCache[text.toLowerCase().trim()] || null,
    tags: [...tags],
    section
  });
}

function renderCollected(seen, sectionKey) {
  let html = '';
  for (const entry of seen) {
    if (entry.section !== sectionKey) continue;
    html += renderItemHtml(entry.text, entry.tags);
  }
  return html;
}

// ===== RENDER HELPERS =====
function renderTagsHtml(tags) {
  return tags.map(t => {
    const adapter = adapters[t];
    const label = adapter ? adapter.label : t.toUpperCase();
    return '<span class="rb-adapter-tag ' + t + '">' + label + '</span>';
  }).join('');
}

function renderItemHtml(text, tags) {
  if (tags.length > 0) {
    return '<li class="adapter">' + renderTagsHtml(tags) + text + '</li>';
  }
  return '<li>' + text + '</li>';
}

// ===== MAIN RENDER =====
function renderRunbook() {
  const courseId = document.getElementById('f-course').value;
  const startStr = document.getElementById('f-start').value;
  const tags = document.getElementById('f-tags').value;
  const funding = getSelectedFunding();
  const container = document.getElementById('runbook');

  const course = courses.find(c => c.id === courseId);
  if (!course || !startStr) {
    container.innerHTML = '<div class="rb-empty">Select a course and start date to generate the runbook.</div>';
    document.getElementById('f-name').value = '';
    document.getElementById('course-info').style.display = 'none';
    return;
  }

  const startDate = new Date(startStr);
  const dur = course.durationWeeks;
  const endDate = addWeeks(startDate, dur);
  document.getElementById('f-name').value = genBatchName(course, startStr, tags);

  // Course info bar
  const info = document.getElementById('course-info');
  info.style.display = 'block';
  info.innerHTML = '<span><strong>Duration:</strong> ' + dur + ' weeks</span>'
    + '<span><strong>NSQF:</strong> Level ' + course.nsqfLevel + '</span>'
    + '<span><strong>Job Role:</strong> ' + course.jobRole + '</span>'
    + '<span><strong>SSC:</strong> ' + course.ssc + '</span>';

  let html = '';

  for (const stage of stages) {
    // --- Determine date range for this stage ---
    let dateStr = '';

    if (stage.spanType === 'delivery') {
      dateStr = fmt(startDate) + ' – ' + fmt(addWeeks(startDate, dur - 2));
    } else if (stage.spanType === 'post-batch') {
      dateStr = fmt(endDate) + ' – ' + fmt(addDays(endDate, 90));
    } else if (stage.weekOffset !== undefined) {
      dateStr = weekRange(startDate, stage.weekOffset);
    } else if (stage.weekOffsetFromEnd !== undefined) {
      dateStr = weekRange(startDate, dur + stage.weekOffsetFromEnd);
    }

    // --- Phase header ---
    html += '<div class="rb-phase" id="rb-' + stage.id + '">';
    html += '<div class="rb-phase-hdr"><h2>' + stage.blStage + ': ' + stage.title + '</h2>';
    html += '<span class="rb-dates">' + dateStr + '</span>';
    html += '<span class="rb-owner">' + stage.owner + '</span></div>';
    html += '<div class="rb-q">' + stage.coreQuestion + '</div>';

    // Per-stage dedup: collect ALL items first, merge tags, then render
    const seen = [];

    // --- DELIVERY: daily/weekly sections + per-week modules + QA + adapters ---
    if (stage.spanType === 'delivery') {
      // Collect section items
      for (const [key, sec] of Object.entries(stage.sections)) {
        for (const item of sec.items) collectItems(item, [], key, seen);
      }
      // Collect adapter items into 'daily' section
      for (const f of funding) {
        const adapter = adapters[f];
        if (!adapter) continue;
        for (const item of adapter.stages[stage.id] || []) collectItems(item, [f], 'daily', seen);
      }
      // Render sections
      for (const [key, sec] of Object.entries(stage.sections)) {
        const rendered = renderCollected(seen, key);
        if (rendered) html += '<div class="rb-section"><h3>' + sec.title + '</h3><ul class="rb-items">' + rendered + '</ul></div>';
      }
      // Per-week modules from course (these don't dedup against checklist items)
      for (let w = 0; w < course.modules.length; w++) {
        const mod = course.modules[w];
        html += '<div class="rb-section"><h3><span class="rb-week-title">Week ' + mod.week + ':</span> ' + mod.title;
        html += ' <span class="rb-dates">(' + weekRange(startDate, w) + ')</span></h3>';
        html += '<ul class="rb-items">';
        for (const a of mod.artifacts) html += '<li>Artifact: ' + a + '</li>';
        if (stage.qaCheckpoints) {
          for (const qa of stage.qaCheckpoints) {
            if (qa.week === mod.week) {
              html += '<li style="font-weight:600; color:var(--stage-ops);">⚑ QA Checkpoint</li>';
              for (const qi of qa.items) {
                collectItems(qi, [], 'qa-w' + mod.week, seen);
              }
              html += renderCollected(seen, 'qa-w' + mod.week);
            }
          }
        }
        html += '</ul></div>';
      }

    // --- LIVELIHOOD: day30/60/90 with computed dates + adapters ---
    } else if (stage.spanType === 'post-batch') {
      const dayLabels = { day30: 30, day60: 60, day90: 90 };
      // Collect all section items
      for (const [key, sec] of Object.entries(stage.sections)) {
        for (const item of sec.items) collectItems(item, [], key, seen);
      }
      // Collect adapter items into 'day90' section
      for (const f of funding) {
        const adapter = adapters[f];
        if (!adapter) continue;
        for (const item of adapter.stages[stage.id] || []) collectItems(item, [f], 'day90', seen);
      }
      // Collect course-specific into 'courseSpecific'
      if (stage.courseSpecific && stage.courseSpecific.show) {
        for (const field of stage.courseSpecific.fields) {
          const vals = resolvePath(course, field);
          if (Array.isArray(vals)) for (const v of vals) collectItems(v, [], 'courseSpecific', seen);
        }
      }
      // Render
      for (const [key, sec] of Object.entries(stage.sections)) {
        let title = sec.title;
        if (dayLabels[key]) title += ' (' + fmt(addDays(endDate, dayLabels[key])) + ')';
        const rendered = renderCollected(seen, key);
        if (rendered) html += '<div class="rb-section"><h3>' + title + '</h3><ul class="rb-items">' + rendered + '</ul></div>';
      }
      if (stage.courseSpecific && stage.courseSpecific.show) {
        const csRendered = renderCollected(seen, 'courseSpecific');
        if (csRendered) html += '<div class="rb-section"><h3>' + stage.courseSpecific.title + '</h3><ul class="rb-items">' + csRendered + '</ul></div>';
      }

    // --- STANDARD STAGES: sections + adapters + course-specific ---
    } else {
      const sectionKeys = Object.keys(stage.sections);
      // Collect core items
      for (const key of sectionKeys) {
        for (const item of stage.sections[key].items) collectItems(item, [], key, seen);
      }
      // Collect adapter items into 'execution' section
      const adapterSection = sectionKeys.includes('execution') ? 'execution' : sectionKeys[Math.min(1, sectionKeys.length - 1)];
      for (const f of funding) {
        const adapter = adapters[f];
        if (!adapter) continue;
        for (const item of adapter.stages[stage.id] || []) collectItems(item, [f], adapterSection, seen);
      }
      // Collect course-specific
      if (stage.courseSpecific && stage.courseSpecific.show) {
        for (const field of stage.courseSpecific.fields) {
          const vals = resolvePath(course, field);
          if (Array.isArray(vals)) for (const v of vals) collectItems(v, [], 'courseSpecific', seen);
        }
      }
      // Render
      for (const key of sectionKeys) {
        const sec = stage.sections[key];
        const rendered = renderCollected(seen, key);
        if (rendered) html += '<div class="rb-section"><h3>' + sec.title + '</h3><ul class="rb-items">' + rendered + '</ul></div>';
      }
      if (stage.courseSpecific && stage.courseSpecific.show) {
        const csRendered = renderCollected(seen, 'courseSpecific');
        if (csRendered) html += '<div class="rb-section"><h3>' + stage.courseSpecific.title + '</h3><ul class="rb-items">' + csRendered + '</ul></div>';
      }
    }

    html += '</div>'; // close rb-phase
  }

  container.innerHTML = html;
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', async () => {
  await loadAll();

  // Default start date: next Monday
  const today = new Date();
  const nextMon = new Date(today);
  nextMon.setDate(today.getDate() + ((8 - today.getDay()) % 7 || 7));
  document.getElementById('f-start').value = nextMon.toISOString().split('T')[0];

  // Bind form changes
  for (const id of ['f-course', 'f-start', 'f-tags', 'f-govt', 'f-csr', 'f-paid']) {
    document.getElementById(id).addEventListener('change', renderRunbook);
    document.getElementById(id).addEventListener('input', renderRunbook);
  }

  // Layer 2: try loading Transformers.js in background (best-effort, never blocks)
  tryLoadEmbeddings();
});

// ===== BACKGROUND EMBEDDING LOADER =====
async function tryLoadEmbeddings() {
  const status = document.getElementById('dedup-status');
  try {
    status.textContent = '(loading dedup model\u2026)';
    const { pipeline } = await import('https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2');
    const embedder = await pipeline('feature-extraction', 'Xenova/all-MiniLM-L6-v2', { quantized: true });
    status.textContent = '(computing embeddings\u2026)';

    // Collect all unique item texts from stages + adapters
    const allTexts = new Set();
    for (const s of stages) {
      for (const sec of Object.values(s.sections || {})) {
        for (const item of sec.items || []) allTexts.add(item.toLowerCase().trim());
      }
      for (const qa of s.qaCheckpoints || []) {
        for (const item of qa.items || []) allTexts.add(item.toLowerCase().trim());
      }
    }
    for (const a of Object.values(adapters)) {
      for (const items of Object.values(a.stages || {})) {
        for (const item of items) allTexts.add(item.toLowerCase().trim());
      }
    }

    // Compute embeddings in small batches to not freeze UI
    const texts = [...allTexts];
    const BATCH = 8;
    for (let i = 0; i < texts.length; i += BATCH) {
      const batch = texts.slice(i, i + BATCH);
      const output = await embedder(batch, { pooling: 'mean', normalize: true });
      for (let j = 0; j < batch.length; j++) {
        embeddingCache[batch[j]] = output[j].data;
      }
      await new Promise(r => setTimeout(r, 0));
    }

    status.textContent = '(semantic dedup active)';
    renderRunbook();
  } catch (e) {
    console.log('Semantic dedup unavailable, using token overlap:', e.message);
    status.textContent = '';
  }
}
</script>

</body>
</html>
